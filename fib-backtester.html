<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FIB BACKTESTER | PHILOLOGY LAB</title>
<style>
  body { background: #000; color: #d4af37; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
  .container { max-width: 1000px; margin: auto; border: 1px solid #333; padding: 30px; background: #050505; }
  h1 { text-align: center; letter-spacing: 5px; border-bottom: 2px solid #d4af37; padding-bottom: 20px; font-size: 1.2rem; }
  .controls { display: flex; gap: 15px; flex-wrap: wrap; margin: 20px 0; align-items: flex-end; }
  label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 5px; }
  select { background: #111; border: 1px solid #d4af37; color: #d4af37; padding: 10px; font-family: inherit; font-size: 0.9rem; }
  button { background: #d4af37; color: #000; border: none; padding: 12px 24px; cursor: pointer; font-weight: bold; letter-spacing: 2px; font-family: inherit; }
  button:hover { background: #fff; }
  button:disabled { background: #555; color: #333; cursor: not-allowed; }
  .pair-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
  .pair-btn { background: #111; border: 1px solid #444; color: #888; padding: 5px 10px; cursor: pointer; font-family: inherit; font-size: 0.8rem; transition: 0.2s; }
  .pair-btn.active { background: #d4af37; color: #000; border-color: #d4af37; }
  #status { color: #888; font-size: 0.8rem; margin: 10px 0; min-height: 20px; }
  #results { margin-top: 20px; }
  .result-card { border: 1px solid #333; margin-bottom: 20px; }
  .result-header { background: #0a0a0a; padding: 10px 15px; border-bottom: 1px solid #333; font-size: 0.85rem; color: #d4af37; letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center; }
  .result-body { padding: 15px; }
  .regime-bar { display: flex; gap: 12px; margin-bottom: 15px; padding: 12px; border: 1px solid #222; background: #080808; flex-wrap: wrap; align-items: center; }
  .regime-tag { font-size: 0.75rem; letter-spacing: 2px; padding: 4px 10px; font-weight: bold; }
  .regime-consolidation { background: #d4af37; color: #000; }
  .regime-trending { background: #30d158; color: #000; }
  .regime-choppy { background: #ff3b3b; color: #000; }
  .regime-prob { font-size: 0.75rem; color: #888; }
  .regime-prob span { color: #ccc; }
  .section-label { font-size: 0.7rem; color: #666; letter-spacing: 2px; margin: 15px 0 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
  .target-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .target-box { border: 1px solid #222; padding: 12px; text-align: center; }
  .target-box.highlighted { border-color: #d4af37; }
  .target-label { font-size: 0.75rem; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
  .target-winrate { font-size: 1.6rem; font-weight: bold; margin: 5px 0; }
  .good { color: #30d158; }
  .ok { color: #ff9500; }
  .bad { color: #ff3b3b; }
  .target-stat { font-size: 0.72rem; color: #666; margin: 2px 0; }
  .target-stat span { color: #aaa; }
  .best-badge { background: #d4af37; color: #000; font-size: 0.6rem; padding: 2px 5px; letter-spacing: 1px; margin-left: 6px; }
  .filter-badge { background: #30d158; color: #000; font-size: 0.6rem; padding: 2px 5px; letter-spacing: 1px; }
  #summary-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.78rem; }
  #summary-table th { background: #111; color: #d4af37; padding: 8px; text-align: center; border: 1px solid #333; letter-spacing: 1px; }
  #summary-table td { padding: 8px; text-align: center; border: 1px solid #222; color: #ccc; }
  #summary-table tr:hover td { background: #0a0a0a; }
  .positive { color: #30d158; }
  .negative { color: #ff3b3b; }
  .progress-bar { height: 3px; background: #222; margin-top: 10px; }
  .progress-fill { height: 100%; background: #d4af37; transition: width 0.3s; }
  .matrix-wrap { margin-top: 10px; }
  .matrix-table { font-size: 0.7rem; border-collapse: collapse; }
  .matrix-table td, .matrix-table th { border: 1px solid #222; padding: 4px 8px; text-align: center; }
  .matrix-table th { color: #666; }
</style>
</head>
<body>
<div class="container">
  <h1>FIBONACCI + MARKOV BACKTESTER</h1>
  <p style="text-align:center; color:#555; font-size:0.75rem;">23.6% ENTRY — 5 PIP STOP — TARGETS: 38.2% / 50% / 61.8% — MARKOV REGIME FILTER</p>

  <div style="margin: 20px 0;">
    <label>SELECT PAIRS</label>
    <div class="pair-grid" id="pair-grid"></div>
  </div>

  <div class="controls">
    <div>
      <label>TIMEFRAME</label>
      <select id="timeframe">
        <option value="5min">5 min</option>
        <option value="15min">15 min</option>
        <option value="30min">30 min</option>
        <option value="1h" selected>1 Hour</option>
        <option value="4h">4 Hour</option>
      </select>
    </div>
    <button id="run-btn" onclick="runBacktest()">RUN BACKTEST</button>
    <button onclick="selectAll()" style="background:#222;color:#d4af37;border:1px solid #d4af37;padding:12px 16px;">ALL</button>
    <button onclick="clearAll()" style="background:#222;color:#888;border:1px solid #444;padding:12px 16px;">CLEAR</button>
  </div>

  <div id="status"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div id="results"></div>

  <div id="summary-section" style="display:none;">
    <div style="color:#d4af37;letter-spacing:2px;margin-top:30px;border-top:1px solid #333;padding-top:20px;">SUMMARY — ALL PAIRS</div>
    <table id="summary-table">
      <thead>
        <tr>
          <th>PAIR</th><th>TF</th><th>REGIME</th><th>→TREND%</th>
          <th>38% ALL</th><th>38% FILTERED</th>
          <th>50% ALL</th><th>50% FILTERED</th>
          <th>61% ALL</th><th>61% FILTERED</th>
          <th>BEST</th>
        </tr>
      </thead>
      <tbody id="summary-body"></tbody>
    </table>
  </div>
</div>

<script>
const PAIRS = ['EUR/USD','GBP/USD','USD/JPY','USD/CHF','USD/CAD','AUD/USD','NZD/USD'];
const selectedPairs = new Set(['GBP/USD','USD/JPY']);
const allResults = [];

function buildPairGrid() {
  const grid = document.getElementById('pair-grid');
  PAIRS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'pair-btn' + (selectedPairs.has(p) ? ' active' : '');
    btn.textContent = p;
    btn.onclick = () => {
      if (selectedPairs.has(p)) { selectedPairs.delete(p); btn.classList.remove('active'); }
      else { selectedPairs.add(p); btn.classList.add('active'); }
    };
    grid.appendChild(btn);
  });
}

function selectAll() { PAIRS.forEach(p => selectedPairs.add(p)); document.querySelectorAll('.pair-btn').forEach(b => b.classList.add('active')); }
function clearAll() { selectedPairs.clear(); document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active')); }

async function runBacktest() {
  const pairs = [...selectedPairs];
  if (!pairs.length) { document.getElementById('status').textContent = 'Select at least one pair.'; return; }
  const tf = document.getElementById('timeframe').value;
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  document.getElementById('results').innerHTML = '';
  document.getElementById('summary-section').style.display = 'none';
  document.getElementById('summary-body').innerHTML = '';
  allResults.length = 0;

  for (let i = 0; i < pairs.length; i++) {
    const pair = pairs[i];
    document.getElementById('status').textContent = `Scanning ${pair} on ${tf}... (${i+1}/${pairs.length})`;
    document.getElementById('progress').style.width = ((i / pairs.length) * 100) + '%';
    try {
      const resp = await fetch('/api/backtest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pair, timeframe: tf })
      });
      const data = await resp.json();
      if (data.error) appendError(pair, tf, data.error);
      else { appendResult(data); allResults.push(data); }
    } catch(e) { appendError(pair, tf, e.message); }
    if (i < pairs.length - 1) await sleep(15000);
  }

  document.getElementById('progress').style.width = '100%';
  document.getElementById('status').textContent = `Complete. ${pairs.length} pair(s) scanned.`;
  btn.disabled = false;
  if (allResults.length > 0) buildSummary();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function winClass(wr) { return wr >= 60 ? 'good' : wr >= 45 ? 'ok' : 'bad'; }

function appendResult(data) {
  const { pair, timeframe, summary, summaryFiltered, regime, candles } = data;
  const targets = ['38.2','50.0','61.8'];
  const bestAll = targets.reduce((a,b) => (summary[a]?.winRate||0) > (summary[b]?.winRate||0) ? a : b);
  const bestFiltered = targets.reduce((a,b) => (summaryFiltered[a]?.winRate||0) > (summaryFiltered[b]?.winRate||0) ? a : b);

  const regimeClass = regime.current === 'CONSOLIDATION' ? 'regime-consolidation' : regime.current === 'TRENDING' ? 'regime-trending' : 'regime-choppy';

  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <div class="result-header">
      <span>${pair} — ${timeframe.toUpperCase()} — ${candles} candles</span>
    </div>
    <div class="result-body">

      <div class="regime-bar">
        <div>
          <div style="font-size:0.7rem;color:#666;margin-bottom:4px;">CURRENT REGIME</div>
          <span class="regime-tag ${regimeClass}">${regime.current}</span>
        </div>
        <div class="regime-prob">
          Next period probabilities:<br>
          <span class="${regime.nextProbs.consolidation > 40 ? 'positive' : ''}">Consolidation ${regime.nextProbs.consolidation}%</span> &nbsp;
          <span>Trending ${regime.nextProbs.trending}%</span> &nbsp;
          <span class="${regime.nextProbs.choppy > 40 ? 'negative' : ''}">Choppy ${regime.nextProbs.choppy}%</span>
        </div>
        <div class="regime-prob">
          Long-run distribution:<br>
          <span>Consol ${regime.stationary.consolidation}%</span> &nbsp;
          <span>Trend ${regime.stationary.trending}%</span> &nbsp;
          <span>Chop ${regime.stationary.choppy}%</span>
        </div>
      </div>

      <div class="section-label">ALL TRADES (no regime filter)</div>
      <div class="target-grid">
        ${targets.map(t => {
          const s = summary[t];
          if (!s || !s.trades) return `<div class="target-box"><div class="target-label">${t}%</div><div style="color:#333;font-size:0.8rem;">no data</div></div>`;
          return `<div class="target-box ${t === bestAll ? 'highlighted' : ''}">
            <div class="target-label">TARGET ${t}% ${t === bestAll ? '<span class="best-badge">BEST</span>' : ''}</div>
            <div class="target-winrate ${winClass(s.winRate)}">${s.winRate}%</div>
            <div class="target-stat">Trades <span>${s.trades}</span> &nbsp; W/L <span class="positive">${s.wins}</span>/<span class="negative">${s.losses}</span></div>
            <div class="target-stat">Total pips <span class="${s.totalPips>=0?'positive':'negative'}">${s.totalPips}</span></div>
            <div class="target-stat">Avg W <span class="positive">${s.avgWinPips}p</span> / L <span class="negative">${s.avgLossPips}p</span></div>
          </div>`;
        }).join('')}
      </div>

      <div class="section-label">CONSOLIDATION REGIME ONLY <span class="filter-badge">FILTERED</span></div>
      <div class="target-grid">
        ${targets.map(t => {
          const s = summaryFiltered[t];
          if (!s || !s.trades) return `<div class="target-box"><div class="target-label">${t}%</div><div style="color:#333;font-size:0.8rem;">no trades in consolidation</div></div>`;
          return `<div class="target-box ${t === bestFiltered ? 'highlighted' : ''}">
            <div class="target-label">TARGET ${t}% ${t === bestFiltered ? '<span class="best-badge">BEST</span>' : ''}</div>
            <div class="target-winrate ${winClass(s.winRate)}">${s.winRate}%</div>
            <div class="target-stat">Trades <span>${s.trades}</span> &nbsp; W/L <span class="positive">${s.wins}</span>/<span class="negative">${s.losses}</span></div>
            <div class="target-stat">Total pips <span class="${s.totalPips>=0?'positive':'negative'}">${s.totalPips}</span></div>
            <div class="target-stat">Avg W <span class="positive">${s.avgWinPips}p</span> / L <span class="negative">${s.avgLossPips}p</span></div>
          </div>`;
        }).join('')}
      </div>

    </div>
  `;
  document.getElementById('results').appendChild(card);
}

function appendError(pair, tf, msg) {
  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `<div class="result-header">${pair} — ${tf.toUpperCase()}</div><div class="result-body" style="color:#ff3b3b;">${msg}</div>`;
  document.getElementById('results').appendChild(card);
}

function buildSummary() {
  document.getElementById('summary-section').style.display = 'block';
  const tbody = document.getElementById('summary-body');
  const targets = ['38.2','50.0','61.8'];
  allResults.forEach(data => {
    const { pair, timeframe, summary, summaryFiltered, regime } = data;
    const bestFiltered = targets.reduce((a,b) => (summaryFiltered[a]?.winRate||0) > (summaryFiltered[b]?.winRate||0) ? a : b);
    const regimeClass = regime.current === 'CONSOLIDATION' ? 'positive' : regime.current === 'TRENDING' ? '' : 'negative';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:#d4af37;">${pair}</td>
      <td>${timeframe}</td>
      <td class="${regimeClass}">${regime.current}</td>
      <td class="${regime.nextProbs.trending > 40 ? 'positive' : ''}">${regime.nextProbs.trending}%</td>
      ${targets.map(t => {
        const all = summary[t]?.winRate || 0;
        const filt = summaryFiltered[t]?.winRate || 0;
        return `<td class="${winClass(all)}">${all}%</td><td class="${winClass(filt)}">${filt}%</td>`;
      }).join('')}
      <td style="color:#d4af37;">${bestFiltered}%</td>
    `;
    tbody.appendChild(tr);
  });
}

buildPairGrid();
</script>
</body>
</html>

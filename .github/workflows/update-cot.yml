name: Update COT Data

on:
  schedule:
    - cron: '45 20 * * 5'
  workflow_dispatch:

jobs:
  update-cot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and parse CFTC COT data
        run: |
          node << 'EOF'
          const https = require('https');
          const fs    = require('fs');

          const url = 'https://www.cftc.gov/dea/newcot/f_year.txt';

          const TARGETS = {
            'BRITISH POUND': 'BRITISH POUND',
            'JAPANESE YEN':  'JAPANESE YEN',
            'EURO FX':       'EURO FX',
            'SWISS FRANC':   'SWISS FRANC',
            'CANADIAN DOLLAR': 'CANADIAN DOLLAR',
            'AUSTRALIAN DOLLAR': 'AUSTRALIAN DOLLAR',
            'NEW ZEALAND DOLLAR': 'NEW ZEALAND DOLLAR',
            'GOLD - COMMODITY': 'GOLD',
            'CRUDE OIL, LIGHT SWEET': 'CRUDE OIL',
            'S&P 500 STOCK INDEX': 'S&P 500',
            'BITCOIN - CHICAGO': 'BITCOIN',
            'NASDAQ-100 STOCK INDEX (MINI)': 'NASDAQ',
            'RUSSELL 2000 MINI INDEX': 'RUSSELL',
          };

          function fetchData(u) {
            return new Promise((resolve, reject) => {
              https.get(u, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
                res.on('error', reject);
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Fetching CFTC report...');
            const raw = await fetchData(url);
            const lines = raw.split('\n');
            const result = {};
            let reportDate = '';

            for (const line of lines) {
              if (!line.trim()) continue;
              const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
              const marketName = cols[0].toUpperCase();

              for (const [pattern, ourKey] of Object.entries(TARGETS)) {
                if (marketName.includes(pattern.toUpperCase())) {
                  if (result[ourKey]) continue;
                  const date      = cols[2];
                  const oi        = parseInt(cols[7])  || 0;
                  const longSpec  = parseInt(cols[8])  || 0;
                  const shortSpec = parseInt(cols[9])  || 0;
                  const longComm  = parseInt(cols[11]) || 0;
                  const shortComm = parseInt(cols[12]) || 0;
                  if (!reportDate && date) reportDate = date + 'T00:00:00.000';
                  result[ourKey] = { oi, longSpec, shortSpec, longComm, shortComm };
                  console.log('Found: ' + ourKey + ' OI=' + oi + ' longComm=' + longComm + ' shortComm=' + shortComm);
                  break;
                }
              }
            }

            const defaults = ['BRITISH POUND','JAPANESE YEN','EURO FX','SWISS FRANC',
              'CANADIAN DOLLAR','AUSTRALIAN DOLLAR','NEW ZEALAND DOLLAR',
              'GOLD','CRUDE OIL','S&P 500','BITCOIN','NASDAQ','RUSSELL'];
            for (const k of defaults) {
              if (!result[k]) {
                result[k] = { oi:0, longSpec:0, shortSpec:0, longComm:0, shortComm:0 };
                console.log('Missing: ' + k);
              }
            }

            if (!reportDate) {
              console.log('ERROR: No report date found. Aborting.');
              process.exit(1);
            }

            const lines2 = [
              '  const COT_REPORT_DATE = "' + reportDate + '";',
              '  const COT_DATA = {'
            ];
            for (const [k, v] of Object.entries(result)) {
              lines2.push('    "' + k + '": { oi: ' + v.oi + ', longSpec: ' + v.longSpec + ', shortSpec: ' + v.shortSpec + ', longComm: ' + v.longComm + ', shortComm: ' + v.shortComm + ' },');
            }
            lines2.push('  };');

            const newBlock = '// COT_BLOCK_START\n' + lines2.join('\n') + '\n  // COT_BLOCK_END';

            let src = fs.readFileSync('api/analyze.js', 'utf8');
            const before = src;

            src = src.replace(/\/\/ COT_BLOCK_START[\s\S]*?\/\/ COT_BLOCK_END/, newBlock);

            if (src === before) {
              console.log('ERROR: Block markers not found in file. No changes made.');
              process.exit(1);
            }

            fs.writeFileSync('api/analyze.js', src, 'utf8');
            console.log('Done. Report date: ' + reportDate);
          }

          main().catch(err => {
            console.error('FAILED:', err.message);
            process.exit(1);
          });
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/analyze.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update COT data $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
